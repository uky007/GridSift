[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uky007/GridSift"
keywords = ["csv", "dfir", "forensics", "large-files", "offline"]
categories = ["command-line-utilities", "parsing"]

# Day-to-day optimised builds: thin LTO keeps the desktop crate's link
# step to about a minute; the hot loops live in one crate and lose nothing.
[profile.release]
lto = "thin"
debug = 1          # keep line tables for profiling

# Shipping builds (`cargo build --profile dist`): fat LTO, one codegen unit.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"
