[package]
name = "gridsift-core"
description = "Core engine of gridsift: bounded-memory, quote-aware access to very large CSV evidence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
blake3 = "1.8.7"
bytecount = "0.6.9"
dirs = "7.0.0"
hmac = "0.13.0"
itoa = "1.0.18"
memchr = "2.8.3"
memmap2 = "0.9.11"
rand = "0.10.3"
rand_chacha = "0.10.0"
regex = "1.13.1"
roaring = "0.11.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"

[dev-dependencies]
csv = "1.4.0"
proptest = "1.11.0"

[target."cfg(unix)".dependencies]
libc = "0.2.189"
