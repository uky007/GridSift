[package]
name = "gridsift"
description = "Offline, evidence-safe workbench for very large CSV security data: desktop application and command-line tool"
# `cargo run` starts the desktop application; the command line is `--bin gridsift`
default-run = "gridsift-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
eframe = "0.32.3"
egui = "0.32.3"
egui_extras = "0.32.3"
egui_plot = "0.33"
gridsift-core = { path = "../gridsift-core", version = "0.1.0" }
indicatif = "0.18.6"
rfd = "0.17.2"
serde_json = "1.0.151"
